networks:
  piccolo_net:
    name: piccolo_net
    driver: bridge

services:
  postgres_db:
      image: postgres:15-alpine
      container_name: postgres_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      volumes:
        # Maps local directory to persist database data
        - ./data/postgres:/var/lib/postgresql/data
        - ./data/postgres-init/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
      networks:
        - piccolo_net
 
# --- Fantasy Football API Service Update ---
  fantasy_football_api:
    build:
      context: ./Fantasy_Football_API
      dockerfile: Dockerfile
    container_name: fantasy_football_api
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - TZ=America/New_York
      - SLEEPER_USERNAME=Gamerleveldad # Insert your Sleeper username here
      - SLEEPER_SEASON=2026
      - SLEEPER_DYNASTY_LEAGUE_ID=1360812344053071872 # Renamed from SLEEPER_LEAGUE_ID
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres_db
    depends_on:
      - postgres_db
    networks:
      - piccolo_net

  # --- Updated Family Dashboard API ---
  family_dashboard_api:
    build:
      context: ./Family_Dashboard_API
      dockerfile: Dockerfile
    container_name: howls-dashboard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./Family_Dashboard_API/assets:/app/assets
      - ./Family_Dashboard_API/token.json:/app/token.json
    environment:
      - LOCAL_MODE=${LOCAL_MODE}
      - TZ=America/New_York
      - WEATHER_API_URL=http://weather_api:8000
      - FLIGHT_API_URL=http://flight_api:8000
      - CRUNCHYROLL_API_URL=http://crunchyroll_api:8000
      - FANTASY_API_URL=http://fantasy_football_api:8000
      - LOCAL_MODE=false
      - TZ=America/New_York
      - STATION_ID=${STATION_ID}
      - WEATHER_API_TOKEN=${WEATHER_API_TOKEN}
      - BIBLE_API_TOKEN=${BIBLE_API_TOKEN}
      - LATITUDE=${LATITUDE}
      - LONGITUDE=${LONGITUDE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres_db
    networks:
      - piccolo_net

  # --- New Isolated UI Container ---
  family_dashboard_ui:
    build:
      context: ./Family_Dashboard_UI
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_HOST=192.168.4.55  # --- 192.168.4.55
        - VITE_BACKEND_PORT=8000
        - VITE_FANTASY_API_URL=http://fantasy_football_api:8000
    container_name: howls-dashboard-ui
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - family_dashboard_api
    networks:
      - piccolo_net
  # --- Agentic Video Game Metadata Microservice ---
  game_scanner_api:
    build:
      context: ./Game_Scanner
      dockerfile: Dockerfile
    container_name: game_scanner_api
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ./data/game_scanner:/app/data
    environment:
      - DB_PATH=/app/data/database.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RAWG_API_KEY=${RAWG_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - DISCORD_WEBHOOK_URL=${GAME_DISCORD_WEBHOOK}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=game_scanner_db
      - POSTGRES_HOST=postgres_db
    depends_on:
      - postgres_db
    networks:
      - piccolo_net

  game_scanner_daemon:
    build:
      context: ./Game_Scanner
      dockerfile: Dockerfile
    container_name: game_scanner_daemon
    restart: unless-stopped
    command: ["python", "scanner.py"]
    volumes:
      - ./data/game_scanner:/app/data
    environment:
      - DB_PATH=/app/data/database.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RAWG_API_KEY=${RAWG_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - DISCORD_WEBHOOK_URL=${GAME_DISCORD_WEBHOOK}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=game_scanner_db
      - POSTGRES_HOST=postgres_db
    depends_on:
      - postgres_db
    networks:
      - piccolo_net

  game_scanner_ui:
      build:
        context: ./Game_Scanner/src/frontend  # Path to your React UI directory
        dockerfile: Dockerfile
      container_name: game_scanner_ui
      restart: unless-stopped
      ports:
        - "8082:80"  # Exposes the UI on port 8082 to avoid collisions
      environment:
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=game_scanner_db
        - POSTGRES_HOST=postgres_db
      depends_on:
        - postgres_db
      networks:
        - piccolo_net

  # --- Persistent Crunchyroll Scanner Daemon ---
  crunchyroll_scanner:
    build:
      context: ./Crunchyroll_Scanner
      dockerfile: Dockerfile
    container_name: crunchyroll_scanner
    restart: unless-stopped
    volumes:
      - ./data/cr_notifier:/app/data
    environment:
      - DB_PATH=/app/data/anime_tracker.db
      - DISCORD_WEBHOOK=${ANIME_DISCORD_WEBHOOK}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TZ=America/New_York
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=crunchyroll_db
      - POSTGRES_HOST=postgres_db
    depends_on:
      - postgres_db
    networks:
      - piccolo_net
  crunchyroll_api:
    build:
      context: ./Crunchyroll_API
      dockerfile: Dockerfile
    container_name: crunchyroll_api
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=crunchyroll_db
      - POSTGRES_HOST=postgres_db
    networks:
      - piccolo_net

  # --- Crunchyroll React UI ---
  crunchyroll_ui:
    build:
      context: ./Crunchyroll_UI
      dockerfile: Dockerfile
    container_name: crunchyroll_ui
    restart: unless-stopped
    ports:
      - "8083:5173"
    environment:
      # React needs to know where to send API requests
      - VITE_API_BASE_URL=http://192.168.4.55:8002
    volumes:
      # Mounts your local src so you get hot-reloading while developing
      - ./Crunchyroll_UI:/app
      - /app/node_modules
    networks:
      - piccolo_net


  # --- Uptime Kuma Monitoring ---
  uptime_kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime_kuma
    restart: unless-stopped
    volumes:
      - ./data/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3001:3001"
    networks:
      - piccolo_net

  # --- InfluxDB for WeatherFlow ---
  influxdb:
    image: influxdb:2-alpine
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./data/influxdb:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    networks:
      - piccolo_net

  # --- Grafana for Dashboards ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    depends_on:
      - influxdb
    networks:
      - piccolo_net

  # --- WeatherFlow Collector ---
  weatherflow_collector:
    image: lux4rd0/weatherflow-collector:latest
    container_name: weatherflow-collector-lux4rd0
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - WEATHERFLOW_COLLECTOR_API_TOKEN=${WEATHER_API_TOKEN}
      - WEATHERFLOW_COLLECTOR_INFLUXDB_URL=http://influxdb:8086
      - WEATHERFLOW_COLLECTOR_INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - WEATHERFLOW_COLLECTOR_INFLUXDB_ORG=${INFLUXDB_ORG}
      - WEATHERFLOW_COLLECTOR_INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    depends_on:
      - influxdb
    volumes:
      - ./influxdb.py:/app/weatherflow-collector/storage/influxdb.py
    networks:
      - piccolo_net

  # --- Daily Weather Brief Daemon ---
  weather_brief_daemon:
    build:
      context: ./Weather_Daemon
      dockerfile: Dockerfile
    container_name: weather_brief_daemon
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - WEATHER_DISCORD_WEBHOOK=${WEATHER_DISCORD_WEBHOOK}
      - GEMINI_API_KEY=${WEATHER_GEMINI_KEY}
      - WU_API_KEY=${WU_API_KEY}
      - LATITUDE=${HOME_LATITUDE}
      - LONGITUDE=${HOME_LONGITUDE}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - XWEATHER_CLIENT_ID=${XWEATHER_CLIENT_ID}
      - XWEATHER_CLIENT_SECRET=${XWEATHER_CLIENT_SECRET}
      - XWEATHER_API_KEY=${XWEATHER_API_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres_db
    depends_on:
      - influxdb
    networks:
      - piccolo_net

  # --- Weather Data API Bridge ---
  weather_api:
    build:
      context: ./Weather_API
      dockerfile: Dockerfile
    container_name: weather_api
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres_db
    depends_on:
      - influxdb
    networks:
      - piccolo_net

  # --- Netdata System Monitoring ---
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    hostname: piccolo
    restart: unless-stopped
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - DAC_READ_SEARCH
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - piccolo_net

  # --- Flight Tracking Daemon (API based) ---
  flight_tracker_daemon:
    build:
      context: ./Flight_Tracker
      dockerfile: Dockerfile
    container_name: flight_tracker_daemon
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - HOME_LATITUDE=${HOME_LATITUDE}
      - HOME_LONGITUDE=${HOME_LONGITUDE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres_db
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - FLIGHT_TRACKER_BUCKET=${FLIGHT_TRACKER_BUCKET}
      - FLIGHT_DISCORD_WEBHOOK=${FLIGHT_DISCORD_WEBHOOK}
    depends_on:
      - postgres_db
      - influxdb
    networks:
      - piccolo_net

  # --- Flight Data API Bridge ---
  flight_api:
    build:
      context: ./Flight_API
      dockerfile: Dockerfile
    container_name: flight_api
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres_db
    depends_on:
      - postgres_db
    networks:
      - piccolo_net
  # --- Maverick Front End ---
  maverick_front_end:
    build:
      context: ./Maverick_FE
      dockerfile: Dockerfile
      args:
        - VITE_HOME_LATITUDE=${HOME_LATITUDE}
        - VITE_HOME_LONGITUDE=${HOME_LONGITUDE}
        - VITE_TOMORROW_API_KEY=${VITE_TOMORROW_API_KEY}
    container_name: maverick_front_end
    restart: unless-stopped
    ports:
      - "8084:80"
    networks:
      - piccolo_net
  # --- Reverse Proxy (The Traffic Cop) ---
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    networks:
      - piccolo_net

  # --- Local DNS (Network Phonebook) ---
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # Port 80 is intentionally omitted so Caddy can handle it
    environment:
      - TZ=America/New_York
      - WEBPASSWORD=${PIHOLE_PASSWORD}
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq.d:/etc/dnsmasq.d
    networks:
      - piccolo_net
# --- ADS-B / SDR Decoder Hub ---
  ultrafeeder:
    image: ghcr.io/sdr-enthusiasts/docker-adsb-ultrafeeder
    container_name: ultrafeeder
    hostname: ultrafeeder
    restart: unless-stopped
    device_cgroup_rules:
      - 'c 189:* rwm'
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ./data/ultrafeeder:/var/globe_history
    ports:
      - "8085:80"       # Tar1090 web UI & JSON endpoints
      - "30005:30005"   # Beast format output (optional: for direct TCP streams)
      - "30003:30003"   # SBS BaseStation format (optional: human-readable ASCII feed)
    environment:
      - TZ=${TZ:-America/New_York}
      - LAT=${HOME_LATITUDE}
      - LONG=${HOME_LONGITUDE}
      - ALT=85ft
      - READSB_DEVICE_TYPE=rtlsdr
      - READSB_RTLSDR_DEVICE=0
      - READSB_GAIN=auto
      - TAR1090_DEFAULTCENTERLAT=${HOME_LATITUDE}
      - TAR1090_DEFAULTCENTERLON=${HOME_LONGITUDE}
      - MLAT_USER=${MLAT_USER:-piccolo_feeder}
      - ULTRAFEEDER_UUID=${ULTRAFEEDER_UUID}
      - "ULTRAFEEDER_CONFIG=adsb,feed.adsb.fi,30004,beast_reduce_plus_out;adsb,in.adsb.lol,30004,beast_reduce_plus_out;adsb,feed.airplanes.live,30004,beast_reduce_plus_out;adsb,feed1.adsbexchange.com,30004,beast_reduce_plus_out;mlat,feed.adsb.fi,31090,39300;mlat,in.adsb.lol,31090,39301;mlat,feed.airplanes.live,31090,39302;mlat,feed.adsbexchange.com,31090,39303;"
      - READSB_EXTRA_ARGS=--db-file /usr/local/share/tar1090/aircraft.csv.gz --db-file-lt
    networks:
      - piccolo_net

  # --- FlightAware Feeder ---
  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware
    container_name: piaware
    restart: unless-stopped
    depends_on:
      - ultrafeeder
    environment:
      - TZ=${TZ:-America/New_York}
      - BEASTHOST=ultrafeeder
      - LAT=${HOME_LATITUDE}
      - LONG=${HOME_LONGITUDE}
      - ALT=85ft                     # Add this line
      - ALLOW_MLAT=yes               # Explicitly enable MLAT
      - FEEDER_ID=${PIAWARE_FEEDER_ID}
    networks:
      - piccolo_net

# --- Simple Map Preview ---
  map_preview:
    image: nginx:alpine
    container_name: map_preview
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - ./Map_Preview/html:/usr/share/nginx/html:ro
    networks:
      - piccolo_net
  # --- MQTT Message Broker ---
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf
    # This command allows anonymous internal connections without needing a config file
    environment:
      - MOSQUITTO_ALLOW_ANONYMOUS=true
      - MOSQUITTO_LISTENER=1883
    networks:
      - piccolo_net

  # --- UDP to MQTT Bridge ---
  tempest_bridge:
    build:
      context: ./Tempest_Bridge
      dockerfile: Dockerfile
    container_name: tempest_bridge
    restart: unless-stopped
    environment:
      - MQTT_BROKER=mosquitto
    depends_on:
      - mosquitto
    ports:
      - "50222:50222/udp" 
    networks:
      - piccolo_net