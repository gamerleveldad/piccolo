server {
    listen 80;
    server_name localhost;

    # Root directory where the React build files are located
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # First attempt to serve the exact request as a file, then as a directory,
        # then fall back to displaying index.html (Required for React Router)
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Standard error page routing
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}